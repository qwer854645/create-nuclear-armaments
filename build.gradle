plugins {
    id 'java-library'
    id 'eclipse'
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def patchDevClientConfig = {
    def configDir = file('run/config')
    configDir.mkdirs()

    def flywheel = file('run/config/flywheel-client.toml')
    if (flywheel.exists()) {
        def text = flywheel.getText('UTF-8')
        // OFF is invalid in Flywheel 1.0.6; instancing avoids indirect GL hangs on Windows.
        text = text.replace('backend = "DEFAULT"', 'backend = "flywheel:instancing"')
        text = text.replace('backend = "OFF"', 'backend = "flywheel:instancing"')
        text = text.replace('backend = "flywheel:indirect"', 'backend = "flywheel:instancing"')
        text = text.replace('workerThreads = -1', 'workerThreads = 0')
        text = text.replace('workerThreads = 1', 'workerThreads = 0')
        text = text.replace('workerThreads = 2', 'workerThreads = 0')
        flywheel.setText(text, 'UTF-8')
    }
}

tasks.register('prepareDevClientConfig') {
    group = 'neoforge'
    description = 'Apply stable Flywheel settings for Windows dev client'
    doLast(patchDevClientConfig)
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'info'
        }

        client {
            client()
            gameDirectory = file('run')
            taskBefore tasks.named('prepareDevClientConfig')
        }

        server {
            server()
            gameDirectory = file('run/server')
        }

        data {
            data()
            gameDirectory = file('run')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }

    mods {
        createnucleararmaments {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://maven.blamejared.com' }
    maven {
        url = 'https://maven.realrobotix.me/master/'
        content {
            includeGroup 'com.rbasamoyai'
        }
    }
}

configurations {
    devRuntimeMods
}

dependencies {
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}") {
        artifact { classifier = 'slim' }
        transitive = false
    }
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")

    compileOnly files('libs/createbigcannons-5.11.5+mc.1.21.1.jar')
    compileOnly files('libs/CBC-Military-Supplement-1.21.1-2.1.0.jar')
    compileOnly files('libs/createnuclear-1.3.2-beta.3-neoforge.jar')
    compileOnly files('libs/create-new-age-1.2.0+neoforge-mc1.21.1.jar')

    devRuntimeMods("com.simibubi.create:create-${minecraft_version}:${create_version}") {
        transitive = false
    }
    devRuntimeMods("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}") {
        transitive = false
    }
    devRuntimeMods("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}") {
        transitive = false
    }
    devRuntimeMods("com.rbasamoyai:ritchiesprojectilelib:${rpl_version}+mc.${minecraft_version}-neoforge") {
        transitive = false
    }
    // Dev-client only (copied into run/mods). Not a published dependency.
    devRuntimeMods("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") {
        transitive = false
    }
}

tasks.register('copyDevMods') {
    onlyIf { !project.hasProperty('bareClient') }
    doLast {
        def modsDir = file('run/mods')
        modsDir.mkdirs()
        copy {
            into modsDir
            from('libs') {
                include '*.jar'
                exclude '*cbc_at*'
                exclude 'create-1.21.1-6.0.10.jar'
            }
            from configurations.devRuntimeMods
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }
        // NeoForge only accepts real mod jars in run/mods; drop Maven library jars.
        def modNameOk = { String name ->
            def n = name.toLowerCase()
            return n.startsWith('create-') ||
                    n.startsWith('createbigcannons') ||
                    n.startsWith('cbc-') ||
                    n.startsWith('createnuclear') ||
                    n.startsWith('ponder-') ||
                    n.startsWith('flywheel-') ||
                    n.startsWith('ritchiesprojectilelib') ||
                    n.startsWith('jei-') ||
                    n.startsWith('esl-')
        }
        modsDir.listFiles()?.each { File f ->
            if (!f.name.toLowerCase().endsWith('.jar')) {
                return
            }
            if (!modNameOk(f.name)) {
                logger.lifecycle("Removing non-mod jar from run/mods: ${f.name}")
                f.delete()
            }
        }
    }
}

tasks.register('prepareBareClientMods') {
    group = 'neoforge'
    description = 'Keep Create stack; remove optional CBC / CBCMS / Create Nuclear jars'
    onlyIf { project.hasProperty('bareClient') }
    doLast {
        def modsDir = file('run/mods')
        modsDir.mkdirs()
        def keepPrefixes = ['create-', 'ponder-', 'flywheel-', 'ritchiesprojectilelib', 'jei-']
        modsDir.listFiles()?.each { File f ->
            if (!f.name.toLowerCase().endsWith('.jar')) {
                return
            }
            def keep = keepPrefixes.any { f.name.toLowerCase().startsWith(it) }
            // Drop optional Addons on bare client (New Age / CBC / CN / CBCMS)
            if (f.name.toLowerCase().startsWith('create-new-age') ||
                    f.name.toLowerCase().startsWith('createbigcannons') ||
                    f.name.toLowerCase().startsWith('cbc-') ||
                    f.name.toLowerCase().startsWith('createnuclear')) {
                keep = false
            }
            if (!keep) {
                f.delete()
            }
        }
        copy {
            into modsDir
            from configurations.devRuntimeMods
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }
        modsDir.listFiles()?.each { File f ->
            if (!f.name.toLowerCase().endsWith('.jar')) {
                return
            }
            def n = f.name.toLowerCase()
            def ok = n.startsWith('create-') || n.startsWith('ponder-') ||
                    n.startsWith('flywheel-') || n.startsWith('ritchiesprojectilelib') ||
                    n.startsWith('jei-')
            if (n.startsWith('create-new-age') || n.startsWith('createbigcannons') ||
                    n.startsWith('cbc-') || n.startsWith('createnuclear')) {
                ok = false
            }
            if (!ok) {
                f.delete()
            }
        }
    }
}

tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
    dependsOn copyDevMods
    dependsOn prepareBareClientMods
}

tasks.withType(JavaCompile).configureEach {
    options.fork = true
    options.incremental = false
    options.forkOptions.memoryMaximumSize = '2g'
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def replaceProperties = [
            minecraft_version              : minecraft_version,
            minecraft_version_range        : minecraft_version_range,
            neo_version                    : neo_version,
            neo_version_range              : neo_version_range,
            loader_version_range           : loader_version_range,
            mod_id                         : mod_id,
            mod_name                       : mod_name,
            mod_license                    : mod_license,
            mod_version                    : mod_version,
            mod_authors                    : mod_authors,
            mod_description                : mod_description,
            create_version_range           : create_version_range,
            createnuclear_version_range    : createnuclear_version_range,
            createbigcannons_version_range : createbigcannons_version_range,
            cbcmoreshells_version_range    : cbcmoreshells_version_range,
            create_new_age_version_range   : create_new_age_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}
